<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #f8fafc;
      }

      main {
        text-align: center;
        max-width: 32rem;
        padding: 2.5rem;
        background: rgba(15, 23, 42, 0.7);
        border-radius: 1.25rem;
        box-shadow: 0 24px 50px rgba(15, 23, 42, 0.4);
      }

      h1 {
        font-size: clamp(2rem, 4vw, 2.75rem);
        margin-bottom: 0.5rem;
      }

      p {
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        background: #38bdf8;
        color: #0f172a;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 20px rgba(56, 189, 248, 0.35);
      }

      small {
        display: block;
        margin-top: 1rem;
        color: #cbd5f5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Index is up and running</h1>
      <p>
        This page now loads correctly with valid HTML, embedded styles, and a
        small JavaScript enhancement to confirm everything is wired up.
      </p>
      <button type="button" id="status-button">Check status</button>
      <small id="status-message" aria-live="polite"></small>
    </main>

    <script>
      const statusButton = document.querySelector("#status-button");
      const statusMessage = document.querySelector("#status-message");

      statusButton?.addEventListener("click", () => {
        const timestamp = new Date().toLocaleTimeString();
        statusMessage.textContent = `All systems operational as of ${timestamp}.`;
      });
    </script>
  </body>
</html>
